# Local production-like stack without Traefik.
# Usage:
#   cp .env.example .env.local.docker   # fill secrets
#   docker compose -f docker-compose.local.yml --env-file .env.local.docker up -d postgres
#   export DATABASE_URL=postgresql://trip:trip@127.0.0.1:5432/trip
#   pnpm db:migrate && pnpm db:import:legacy
#   pnpm worker:media   # separate terminal
#   pnpm dev

services:
  postgres:
    image: postgres:17.10-bookworm
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trip}
      POSTGRES_USER: ${POSTGRES_USER:-trip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trip}
    volumes:
      - ./runtime/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    shm_size: 256mb
