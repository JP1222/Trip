worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout combined;
  error_log /dev/stderr warn;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  etag on;

  server {
    listen 8080;
    listen [::]:8080;

    location = /health {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    # Metadata is authoritative in PostgreSQL and must not leak from legacy JSON.
    location ~ ^/uploads/[^/]+/photos\.json$ {
      return 404;
    }

    location ^~ /media/ {
      alias /srv/media-public/;
      limit_except GET HEAD { deny all; }
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header X-Content-Type-Options "nosniff" always;
    }

    # Read-only compatibility window for pre-migration URLs.
    location ^~ /uploads/ {
      alias /srv/legacy-uploads/;
      limit_except GET HEAD { deny all; }
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
      return 404;
    }
  }
}
