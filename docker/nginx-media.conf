worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # read_only rootfs: keep temp/cache under tmpfs /tmp
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  access_log /dev/stdout combined;
  error_log /dev/stderr warn;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  etag on;

  server {
    listen 8080;
    listen [::]:8080;

    location = /health {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    # Metadata is authoritative in PostgreSQL and must not leak from legacy JSON.
    location ~ ^/uploads/[^/]+/photos\.json$ {
      return 404;
    }

    location ^~ /media/ {
      alias /srv/media-public/;
      limit_except GET HEAD { deny all; }
      # Do NOT use "always" on Cache-Control — that would cache 404s as
      # immutable for a year (browser shows broken thumbs after a brief miss).
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header X-Frame-Options "DENY" always;
    }

    # Optional compatibility for leftover import paths (empty if unused).
    location ^~ /uploads/ {
      alias /srv/legacy-uploads/;
      limit_except GET HEAD { deny all; }
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
      return 404;
    }
  }
}
